{{define "404-content"}}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 relative overflow-hidden">

  <div class="z-10 max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
    <div class="px-6 py-10 text-center">
      <!-- Error Icon -->
      <div class="inline-flex items-center justify-center w-20 h-20 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <!-- Error message -->
      <div class="mb-8">
        <h1 class="text-7xl font-bold text-gray-900 mb-2 tracking-tight">404</h1>
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Page not found</h2>
        <p class="text-gray-600">
          This page doesn't exist or may have moved.
        </p>
      </div>

      <!-- Action button -->
      <div>
        <a href="/jobs" class="inline-block px-6 py-2.5 bg-primary hover:bg-primary-dark text-white font-semibold rounded-lg transition-colors duration-300 flex items-center justify-center">
          Go Home
        </a>
      </div>
    </div>
  </div>
</div>
{{end}}
