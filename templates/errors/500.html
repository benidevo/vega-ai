{{define "500-content"}}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 relative overflow-hidden">

  <div class="z-10 max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
    <div class="px-6 py-10 text-center">
      <!-- Error Icon -->
      <div class="inline-flex items-center justify-center w-20 h-20 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>

      <!-- Error message -->
      <div class="mb-8">
        <h1 class="text-7xl font-bold text-gray-900 mb-2 tracking-tight">500</h1>
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Server Error</h2>
        <p class="text-gray-600">
          Something broke on our end. Try refreshing, or come back in a moment.
        </p>
      </div>

      <!-- Action button -->
      <div>
        <a href="/jobs" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 bg-primary hover:bg-primary-dark text-white font-semibold rounded-lg transition-colors duration-300">
          Go Home
        </a>
      </div>
    </div>
  </div>
</div>
{{end}}
