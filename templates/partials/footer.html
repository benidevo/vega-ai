{{define "footer"}}
<footer class="bg-white border-t border-gray-200 mt-auto" style="margin-top: 3rem;">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      
      <!-- Left side: Copyright and License -->
      <div class="flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-6 text-sm text-gray-500">
        <div class="flex items-center space-x-2">
          <span>© {{.currentYear}} Vega AI</span>
        </div>
        <div class="flex items-center space-x-2">
          <span>Licensed under</span>
          <a href="https://www.gnu.org/licenses/agpl-3.0.en.html" 
             class="text-primary hover:text-primary-dark transition-colors duration-200 underline decoration-1 underline-offset-2"
             target="_blank" 
             rel="noopener noreferrer">
            GNU AGPL v3
          </a>
        </div>
      </div>

      <!-- Middle: Legal links (only in cloud mode) -->
      {{if .cfg.IsCloudMode}}
      <div class="flex items-center space-x-4 text-sm">
        <a href="/privacy" 
           class="text-gray-500 hover:text-primary transition-colors duration-200">
          Privacy Policy
        </a>
      </div>
      {{end}}

      <!-- Right side: App info and Source link -->
      <div class="flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-6 text-sm text-gray-500">
        <div class="flex items-center space-x-2">
          <span class="text-primary font-medium">Vega AI</span>
        </div>
        {{if not .isCloudMode}}
        <div class="flex items-center space-x-2">
          <a href="https://github.com/benidevo/vega-ai" 
             class="text-primary hover:text-primary-dark transition-colors duration-200 underline decoration-1 underline-offset-2"
             target="_blank" 
             rel="noopener noreferrer">
            <span class="flex items-center space-x-1">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">

        </div>

      </div>
    </div>
  </div>
</footer>
