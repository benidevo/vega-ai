{{define "partials/logo_component.html"}}
{{if eq . "xs"}}
  <div class="flex items-center">
    <img src="/static/images/star-icon.png" alt="Vega" class="h-6 w-6">
    <span class="ml-2 text-base font-bold text-gray-900">Vega <span class="font-light text-gray-500">AI</span></span>
  </div>
{{else if eq . "sm"}}
  <div class="flex items-center">
    <img src="/static/images/star-icon.png" alt="Vega" class="h-8 w-8">
    <span class="ml-2.5 text-xl font-bold text-gray-900">Vega <span class="font-light text-gray-500">AI</span></span>
  </div>
{{else if eq . "md"}}
  <div class="flex items-center">
    <img src="/static/images/star-icon.png" alt="Vega" class="h-10 w-10">
    <span class="ml-3 text-2xl font-bold text-gray-900">Vega <span class="font-light text-gray-500">AI</span></span>
  </div>
{{else if eq . "lg"}}
  <div class="flex items-center">
    <img src="/static/images/star-icon.png" alt="Vega" class="h-12 w-12">
    <span class="ml-3 text-3xl font-bold text-gray-900">Vega <span class="font-light text-gray-500">AI</span></span>
  </div>
{{else}}
  <div class="flex items-center">
    <img src="/static/images/star-icon.png" alt="Vega" class="h-8 w-8">
    <span class="ml-2.5 text-xl font-bold text-gray-900">Vega <span class="font-light text-gray-500">AI</span></span>
  </div>
{{end}}
{{end}}
