{{define "partials/empty_state.html"}}
<div class="text-center py-12 px-4 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
  <div class="mb-6 text-gray-600">
    <svg class="mx-auto h-24 w-24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
  </div>
  <h3 class="text-lg font-medium text-gray-900 mb-2">{{.Title}}</h3>
  <p class="text-gray-500 mb-6 max-w-sm">{{.Description}}</p>
  {{if .ActionText}}
  <a href="{{.ActionLink}}" class="inline-flex items-center px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg shadow-sm transition-all duration-200 ease-in-out focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">
    {{.ActionText}}
  </a>
  {{end}}
</div>
{{end}}
