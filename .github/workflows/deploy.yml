name: Deploy to Hetzner Cloud

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy (leave empty for latest master)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.ref }}
      
      - name: Set deployment tag
        id: set-tag
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            if ! echo "$INPUT_SHA" | grep -qE '^[a-f0-9]{7,40}$'; then
              echo "Error: Invalid commit SHA format"
              exit 1
            fi
            echo "tag=$INPUT_SHA" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cloud-${{ steps.set-tag.outputs.tag }}
            type=raw,value=cloud-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/prod/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLOUD_MODE=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Hetzner VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          envs: DEPLOY_TAG
          script: |
            cd /opt/vega-ai
            export IMAGE_TAG=cloud-${DEPLOY_TAG}
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
            docker image prune -f
            echo "Deployment completed successfully"